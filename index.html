<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Painel de Acesso — Quad Browser</title>
<style>
  :root {
    --bg: #0e121c;
    --card: #161c29;
    --card-border: #262e40;
    --text: #eef1f7;
    --text-dim: #9aa4b8;
    --accent: #5b8cff;
    --danger: #ff5c6c;
    --danger-bg: #3a1b21;
    --ok: #37c977;
    --ok-bg: #103324;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-border: #e2e6f0;
      --text: #1b2233;
      --text-dim: #626b80;
      --accent: #3b6fe0;
      --danger: #d43a4a;
      --danger-bg: #ffe6e8;
      --ok: #1f9d5c;
      --ok-bg: #e4f8ee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e121c;
    --card: #161c29;
    --card-border: #262e40;
    --text: #eef1f7;
    --text-dim: #9aa4b8;
    --accent: #5b8cff;
    --danger: #ff5c6c;
    --danger-bg: #3a1b21;
    --ok: #37c977;
    --ok-bg: #103324;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 4px 0 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* Login screen */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
  }
  #login-screen .card {
    width: 100%;
    max-width: 340px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    width: 100%;
    margin-top: 14px;
  }
  .btn-primary:disabled {
    opacity: 0.6;
  }
  #login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* Dashboard */
  #dashboard { display: none; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .logout-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--card-border);
    font-size: 13px;
    padding: 8px 12px;
  }
  .summary {
    display: flex;
    gap: 10px;
    margin: 18px 0;
  }
  .pill {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
  }
  .pill .num { font-size: 22px; font-weight: 700; }
  .pill .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .device-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .device-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .device-info { min-width: 0; flex: 1; }
  .device-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    word-break: break-all;
    color: var(--text);
    margin-bottom: 6px;
  }
  .device-ip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .device-ip-shared {
    color: #e8b13a;
    font-weight: 600;
  }
  .device-hardware-warning {
    font-size: 12px;
    font-weight: 600;
    color: var(--danger);
    background: var(--danger-bg);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 6px;
  }
  .device-meta {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge-active { background: var(--ok-bg); color: var(--ok); }
  .badge-blocked { background: var(--danger-bg); color: var(--danger); }
  .badge-pending { background: #3a2f10; color: #e8b13a; }
  .badge-expired { background: var(--danger-bg); color: var(--danger); }

  .plan-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .plan-btn {
    flex: 1;
    min-width: 70px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    font-size: 12px;
    padding: 8px 6px;
  }
  .plan-btn:disabled { opacity: 0.5; }
  .plan-btn.selected { border-color: var(--accent); color: var(--accent); }

  .custom-time-form {
    display: none;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px;
    margin-top: 8px;
    padding: 10px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--bg);
    width: 100%;
  }
  .custom-time-form.open { display: flex; }
  .custom-time-field { display: flex; flex-direction: column; gap: 4px; }
  .custom-time-field label { font-size: 11px; color: var(--text-muted, #999); }
  .custom-time-field input {
    width: 68px;
    background: var(--card-bg, var(--bg));
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .custom-time-actions { display: flex; gap: 6px; margin-left: auto; }

  .toggle-btn {
    flex-shrink: 0;
    font-size: 13px;
    padding: 9px 14px;
    white-space: nowrap;
  }
  .toggle-btn.block { background: var(--danger-bg); color: var(--danger); }
  .toggle-btn.unblock { background: var(--ok-bg); color: var(--ok); }
  .toggle-btn.approve { background: var(--ok-bg); color: var(--ok); }
  .toggle-btn.delete { background: transparent; color: var(--text-dim); border: 1px solid var(--card-border); }
  .toggle-btn.edit-time { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .toggle-btn:disabled { opacity: 0.5; cursor: default; }

  .device-model {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .device-actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    flex-shrink: 0;
  }

  .note-row {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .note-input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    resize: vertical;
    min-height: 34px;
    font-family: inherit;
  }
  .note-save-btn {
    background: var(--accent);
    color: white;
    font-size: 12.5px;
    padding: 8px 12px;
    flex-shrink: 0;
  }
  .note-save-btn:disabled { opacity: 0.5; }
  .note-saved-hint {
    font-size: 11px;
    color: var(--ok);
    margin-top: 4px;
    height: 14px;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  .status-msg {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  /* Contacts config card */
  .contacts-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .contacts-card h2 {
    font-size: 15px;
    margin: 0 0 2px;
  }
  .contacts-card .subtitle {
    margin-bottom: 12px;
  }
  .contact-field { margin-bottom: 10px; }
  .contact-field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .contact-field input { margin-top: 0; }
  .extra-contact-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .extra-contact-row input { margin-top: 0; }
  .extra-contact-row .extra-label { flex: 1; min-width: 0; }
  .extra-contact-row .extra-url { flex: 2; min-width: 0; }
  .extra-remove-btn {
    flex-shrink: 0;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--card-border);
    font-size: 16px;
    padding: 0 12px;
    line-height: 1;
  }
  .extra-add-btn {
    background: transparent;
    color: var(--accent);
    border: 1px dashed var(--accent);
    font-size: 12.5px;
    padding: 8px 12px;
    width: 100%;
    margin-top: 2px;
  }
  .contacts-save-btn {
    background: var(--accent);
    color: white;
    font-size: 13px;
    padding: 10px 16px;
    width: 100%;
    margin-top: 12px;
  }
  .contacts-save-btn:disabled { opacity: 0.5; }
  .contacts-saved-hint {
    font-size: 11px;
    color: var(--ok);
    margin-top: 6px;
    min-height: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="login-screen">
    <div class="card">
      <h1>Painel de Acesso</h1>
      <div class="subtitle">Quad Browser — controle de dispositivos</div>
      <input id="email" type="email" placeholder="Seu e-mail" autocomplete="username" />
      <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" />
      <button class="btn-primary" id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="dashboard">
    <div class="topbar">
      <div>
        <h1>Dispositivos</h1>
        <div class="subtitle" id="admin-email-label"></div>
      </div>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>

    <div class="summary">
      <div class="pill"><div class="num" id="count-total">—</div><div class="label">Total</div></div>
      <div class="pill"><div class="num" id="count-pending">—</div><div class="label">Pendentes</div></div>
      <div class="pill"><div class="num" id="count-active">—</div><div class="label">Ativos</div></div>
      <div class="pill"><div class="num" id="count-blocked">—</div><div class="label">Bloqueados</div></div>
    </div>

    <div class="contacts-card">
      <h2>Contato no app</h2>
      <div class="subtitle">Aparece no botão de contato do app (visualização em grade). Deixe em branco o que não quiser mostrar.</div>

      <div class="contact-field">
        <label for="contact-discord-profile">Discord — perfil</label>
        <input id="contact-discord-profile" type="text" placeholder="ex: discord.com/users/123456789012345678" />
      </div>
      <div class="contact-field">
        <label for="contact-discord-server">Discord — servidor</label>
        <input id="contact-discord-server" type="text" placeholder="ex: discord.gg/abcdef" />
      </div>
      <div class="contact-field">
        <label for="contact-whatsapp">WhatsApp</label>
        <input id="contact-whatsapp" type="text" placeholder="ex: 5511999999999 ou wa.me/5511999999999" />
      </div>

      <div class="contact-field">
        <label>Outros contatos</label>
        <div id="extra-contacts-list"></div>
        <button type="button" class="extra-add-btn" id="extra-add-btn">+ Adicionar outro contato</button>
      </div>

      <button type="button" class="contacts-save-btn" id="contacts-save-btn">Salvar contatos</button>
      <div class="contacts-saved-hint" id="contacts-saved-hint"></div>
    </div>

    <div id="device-list"></div>
    <div id="status-msg" class="status-msg"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp,
    getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  // Config from this project's google-services.json (public web config —
  // safe to expose; access is controlled by Firestore security rules +
  // requiring a signed-in admin, not by hiding these values).
  const firebaseConfig = {
    apiKey: "AIzaSyCfVTZOKLoa9emMsLuT1c9pVCka4--QSTo",
    projectId: "quadbrowser-acesso",
    storageBucket: "quadbrowser-acesso.firebasestorage.app",
    messagingSenderId: "1029834448102",
    appId: "1:1029834448102:android:e2ddd8d064101c3ae3ef27"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginScreen = document.getElementById("login-screen");
  const dashboard = document.getElementById("dashboard");
  const loginBtn = document.getElementById("login-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginError = document.getElementById("login-error");
  const deviceList = document.getElementById("device-list");
  const statusMsg = document.getElementById("status-msg");
  const adminEmailLabel = document.getElementById("admin-email-label");
  const countTotal = document.getElementById("count-total");
  const countPending = document.getElementById("count-pending");
  const countActive = document.getElementById("count-active");
  const countBlocked = document.getElementById("count-blocked");
  const contactDiscordProfile = document.getElementById("contact-discord-profile");
  const contactDiscordServer = document.getElementById("contact-discord-server");
  const contactWhatsapp = document.getElementById("contact-whatsapp");
  const extraContactsList = document.getElementById("extra-contacts-list");
  const extraAddBtn = document.getElementById("extra-add-btn");
  const contactsSaveBtn = document.getElementById("contacts-save-btn");
  const contactsSavedHint = document.getElementById("contacts-saved-hint");

  let unsubscribeDevices = null;
  const pendingToggles = new Set();
  let latestDocs = null;
  // Tracks which device currently has its plan-picker/time-editor panel
  // open, and in what mode. renderDevices() rebuilds every card from
  // scratch on every Firestore update (which fires constantly, e.g. every
  // time a device's "last seen" changes), so without this the panel would
  // instantly close again right after opening it — this lets the rebuild
  // restore the panel to how the admin left it.
  let openPickerDeviceId = null;
  let openPickerUnblocking = false;
  // Same problem, same fix, for the nested "Personalizado" (custom days/
  // hours/minutes) form: it also got wiped shut on every Firestore update
  // unless we remember it was open and restore that after each rebuild.
  let openCustomFormDeviceId = null;

  setInterval(() => {
    if (latestDocs) renderDevices(latestDocs);
  }, 30000);

  loginBtn.addEventListener("click", async () => {
    loginError.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Entrando...";
    try {
      await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
    } catch (err) {
      loginError.textContent = "E-mail ou senha incorretos.";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar";
    }
  });

  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = "none";
      dashboard.style.display = "block";
      adminEmailLabel.textContent = user.email;
      subscribeToDevices();
      loadContacts();
    } else {
      loginScreen.style.display = "flex";
      dashboard.style.display = "none";
      if (unsubscribeDevices) {
        unsubscribeDevices();
        unsubscribeDevices = null;
      }
    }
  });

  function formatTimestamp(ts) {
    if (!ts) return "—";
    try {
      const date = ts.toDate();
      return date.toLocaleString("pt-BR", {
        day: "2-digit", month: "2-digit", year: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    } catch {
      return "—";
    }
  }

  function daysSince(ts) {
    if (!ts) return null;
    try {
      const date = ts.toDate();
      const diffMs = Date.now() - date.getTime();
      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      return days < 0 ? 0 : days;
    } catch {
      return null;
    }
  }

  function formatDaysLabel(days) {
    if (days === null) return "—";
    if (days === 0) return "Hoje";
    if (days === 1) return "1 dia";
    return days + " dias";
  }

  // Plans: id -> { label, durationMs (null = pick manually / no fixed duration) }
  const PLAN_OPTIONS = [
    { id: "trial_24h", label: "Teste 24h", durationMs: 24 * 60 * 60 * 1000 },
    { id: "15_days", label: "15 dias", durationMs: 15 * 24 * 60 * 60 * 1000 },
    { id: "30_days", label: "30 dias", durationMs: 30 * 24 * 60 * 60 * 1000 },
  ];

  function formatTimeRemaining(expiresAtDate) {
    const remainingMs = expiresAtDate.getTime() - Date.now();
    if (remainingMs <= 0) return null;
    const totalMinutes = Math.floor(remainingMs / 60000);
    const days = Math.floor(totalMinutes / (24 * 60));
    const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return days + (days === 1 ? " dia" : " dias") + (hours > 0 ? ` e ${hours}h` : "");
    if (hours > 0) return `${hours}h` + (minutes > 0 ? ` ${minutes}min` : "");
    return `${Math.max(minutes, 1)} min`;
  }

  function subscribeToDevices() {
    statusMsg.textContent = "Carregando dispositivos...";
    const q = query(collection(db, "devices"), orderBy("lastSeen", "desc"));

    unsubscribeDevices = onSnapshot(
      q,
      (snapshot) => {
        statusMsg.textContent = "";
        latestDocs = snapshot.docs;
        renderDevices(snapshot.docs);
      },
      (err) => {
        statusMsg.textContent = "Erro ao carregar dispositivos: " + err.message;
      }
    );
  }

  function renderDevices(docs) {
    if (docs.length === 0) {
      deviceList.innerHTML = "";
      statusMsg.innerHTML = '<div class="empty-state">Nenhum dispositivo registrado ainda.<br>Assim que alguém abrir o app, ele aparece aqui.</div>';
      countTotal.textContent = "0";
      countPending.textContent = "0";
      countActive.textContent = "0";
      countBlocked.textContent = "0";
      return;
    }

    let pending = 0, active = 0, blocked = 0;
    deviceList.innerHTML = "";

    // Pre-pass: count how many devices currently share each IP address, so
    // we can flag it inline on every card below. An IP shown by 2+ devices
    // is a signal worth the admin's attention (same network, or possibly
    // the same person running more than one "free" device) — not proof by
    // itself, since whole households/offices share one IP too.
    const ipCounts = {};
    docs.forEach((docSnap) => {
      const ip = docSnap.data().ipAddress;
      if (ip) ipCounts[ip] = (ipCounts[ip] || 0) + 1;
    });

    // Map of deviceId -> the device doc that first claimed its hardware
    // fingerprint, for devices whose reusedHardwareFrom points at a device
    // still present in this snapshot. Written once at registration by the
    // app (see AccessControlGate.claimHardwareFingerprint); the panel just
    // reads and displays it here.
    const byId = {};
    docs.forEach((docSnap) => { byId[docSnap.id] = docSnap.data(); });

    docs.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      const rawStatus = data.status === "blocked" ? "blocked" : (data.status === "pending" ? "pending" : "active");
      const expiresAtDate = data.expiresAt ? data.expiresAt.toDate() : null;
      const isExpired = rawStatus === "active" && expiresAtDate && expiresAtDate.getTime() <= Date.now();
      const status = isExpired ? "expired" : rawStatus;
      if (status === "blocked" || status === "expired") blocked++;
      else if (status === "pending") pending++;
      else active++;

      const card = document.createElement("div");
      card.className = "device-card";

      const top = document.createElement("div");
      top.className = "device-card-top";

      const info = document.createElement("div");
      info.className = "device-info";

      const modelEl = document.createElement("div");
      modelEl.className = "device-model";
      modelEl.textContent = data.deviceModel || "Modelo desconhecido";

      const idEl = document.createElement("div");
      idEl.className = "device-id";
      idEl.textContent = id;

      const ip = data.ipAddress || null;
      const ipSharedCount = ip ? (ipCounts[ip] || 0) : 0;
      const ipIsShared = ipSharedCount >= 2;

      const ipEl = document.createElement("div");
      ipEl.className = "device-ip" + (ipIsShared ? " device-ip-shared" : "");
      ipEl.textContent = ip
        ? ("IP: " + ip + (ipIsShared ? " ⚠ mesmo IP de mais " + (ipSharedCount - 1) + " dispositivo" + (ipSharedCount - 1 > 1 ? "s" : "") : ""))
        : "IP: desconhecido";

      const reusedFromId = data.reusedHardwareFrom || null;
      const reusedFromExists = reusedFromId && byId[reusedFromId];
      let hardwareWarningEl = null;
      if (reusedFromExists) {
        hardwareWarningEl = document.createElement("div");
        hardwareWarningEl.className = "device-hardware-warning";
        hardwareWarningEl.textContent =
          "⚠ Este aparelho já foi usado antes (dispositivo " + reusedFromId + "). Pode ser reinstalação para tentar renovar o teste grátis.";
      }

      const meta = document.createElement("div");
      meta.className = "device-meta";

      const badge = document.createElement("span");
      const badgeClassMap = { blocked: "badge-blocked", pending: "badge-pending", active: "badge-active", expired: "badge-expired" };
      const badgeTextMap = { blocked: "Bloqueado", pending: "Aguardando aprovação", active: "Ativo", expired: "Expirado" };
      badge.className = "badge " + badgeClassMap[status];
      badge.textContent = badgeTextMap[status];
      meta.appendChild(badge);

      if (status === "active" && expiresAtDate) {
        const timeLeft = document.createElement("span");
        const remaining = formatTimeRemaining(expiresAtDate);
        timeLeft.textContent = remaining ? ("Restam: " + remaining) : "Expirando...";
        meta.appendChild(timeLeft);
      }

      const daysLabel = document.createElement("span");
      daysLabel.textContent = "Usando há: " + formatDaysLabel(daysSince(data.firstSeen));
      meta.appendChild(daysLabel);

      const lastSeen = document.createElement("span");
      lastSeen.textContent = "Visto: " + formatTimestamp(data.lastSeen);
      meta.appendChild(lastSeen);

      info.appendChild(modelEl);
      info.appendChild(idEl);
      info.appendChild(ipEl);
      if (hardwareWarningEl) info.appendChild(hardwareWarningEl);
      info.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "device-actions";

      const isPending = pendingToggles.has(id);

      if (status === "pending") {
        const rejectBtn = document.createElement("button");
        rejectBtn.className = "toggle-btn block";
        rejectBtn.textContent = isPending ? "..." : "Bloquear";
        rejectBtn.disabled = isPending;
        rejectBtn.addEventListener("click", () => setStatus(id, "blocked"));
        actions.appendChild(rejectBtn);
      } else if (status === "blocked" || status === "expired") {
        const unblockBtn = document.createElement("button");
        unblockBtn.className = "toggle-btn unblock";
        unblockBtn.textContent = isPending ? "..." : "Desbloquear";
        unblockBtn.disabled = isPending;
        unblockBtn.addEventListener("click", () => openTimeEditor(id, expiresAtDate, true));
        actions.appendChild(unblockBtn);
      } else {
        const blockBtn = document.createElement("button");
        blockBtn.className = "toggle-btn block";
        blockBtn.textContent = isPending ? "..." : "Bloquear";
        blockBtn.disabled = isPending;
        blockBtn.addEventListener("click", () => setStatus(id, "blocked"));
        actions.appendChild(blockBtn);

        const editTimeBtn = document.createElement("button");
        editTimeBtn.className = "toggle-btn edit-time";
        editTimeBtn.textContent = "Editar tempo";
        editTimeBtn.disabled = isPending;
        editTimeBtn.addEventListener("click", () => openTimeEditor(id, expiresAtDate, false));
        actions.appendChild(editTimeBtn);
      }

      top.appendChild(info);
      top.appendChild(actions);
      card.appendChild(top);

      // Plan picker: shown for a pending device (choosing the initial plan
      // to approve with) and reused as the "edit time" panel for an
      // active/blocked/expired device (toggled via openTimeEditor).
      const planPicker = document.createElement("div");
      planPicker.className = "plan-picker";
      const shouldBeOpen = status === "pending" || openPickerDeviceId === id;
      planPicker.style.display = shouldBeOpen ? "flex" : "none";
      planPicker.dataset.deviceId = id;
      if (openPickerDeviceId === id) planPicker.dataset.unblocking = openPickerUnblocking ? "1" : "0";

      PLAN_OPTIONS.forEach((plan) => {
        const planBtn = document.createElement("button");
        planBtn.className = "plan-btn";
        planBtn.textContent = plan.label;
        planBtn.disabled = isPending;
        planBtn.addEventListener("click", () => approveOrExtend(id, plan));
        planPicker.appendChild(planBtn);
      });

      const customBtn = document.createElement("button");
      customBtn.className = "plan-btn";
      customBtn.textContent = "Personalizado";
      customBtn.disabled = isPending;
      customBtn.addEventListener("click", () => {
        customForm.classList.toggle("open");
        openCustomFormDeviceId = customForm.classList.contains("open") ? id : null;
      });
      planPicker.appendChild(customBtn);

      card.appendChild(planPicker);

      // Inline custom-time form: separate whole-number fields for days,
      // hours and minutes instead of a single decimal-days prompt.
      const customForm = document.createElement("div");
      customForm.className = "custom-time-form";
      customForm.dataset.deviceId = id;
      if (openCustomFormDeviceId === id) customForm.classList.add("open");

      const fieldDefs = [
        { key: "days", label: "Dias" },
        { key: "hours", label: "Horas" },
        { key: "minutes", label: "Minutos" },
      ];
      const fieldInputs = {};
      fieldDefs.forEach((def) => {
        const field = document.createElement("div");
        field.className = "custom-time-field";
        const label = document.createElement("label");
        label.textContent = def.label;
        const inputEl = document.createElement("input");
        inputEl.type = "number";
        inputEl.min = "0";
        inputEl.step = "1";
        inputEl.placeholder = "0";
        field.appendChild(label);
        field.appendChild(inputEl);
        customForm.appendChild(field);
        fieldInputs[def.key] = inputEl;
      });

      const customFormActions = document.createElement("div");
      customFormActions.className = "custom-time-actions";
      const customConfirmBtn = document.createElement("button");
      customConfirmBtn.className = "toggle-btn unblock";
      customConfirmBtn.textContent = "Aplicar";
      customConfirmBtn.disabled = isPending;
      customConfirmBtn.addEventListener("click", () => {
        applyCustomTime(
          id,
          Number(fieldInputs.days.value) || 0,
          Number(fieldInputs.hours.value) || 0,
          Number(fieldInputs.minutes.value) || 0,
        );
      });
      const customCancelBtn = document.createElement("button");
      customCancelBtn.className = "toggle-btn block";
      customCancelBtn.textContent = "Cancelar";
      customCancelBtn.addEventListener("click", () => {
        customForm.classList.remove("open");
        if (openCustomFormDeviceId === id) openCustomFormDeviceId = null;
        fieldDefs.forEach((def) => { fieldInputs[def.key].value = ""; });
      });
      customFormActions.appendChild(customConfirmBtn);
      customFormActions.appendChild(customCancelBtn);
      customForm.appendChild(customFormActions);

      card.appendChild(customForm);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "toggle-btn delete";
      deleteBtn.textContent = isPending ? "..." : "Excluir dispositivo";
      deleteBtn.disabled = isPending;
      deleteBtn.style.marginTop = "8px";
      deleteBtn.style.width = "100%";
      deleteBtn.addEventListener("click", () => deleteDevice(id, data.deviceModel));
      card.appendChild(deleteBtn);

      // Note row
      const noteRow = document.createElement("div");
      noteRow.className = "note-row";

      const noteInput = document.createElement("textarea");
      noteInput.className = "note-input";
      noteInput.placeholder = "Anotação sobre este dispositivo...";
      noteInput.value = data.note || "";
      noteInput.rows = 1;

      const noteSaveBtn = document.createElement("button");
      noteSaveBtn.className = "note-save-btn";
      noteSaveBtn.textContent = "Salvar";

      noteRow.appendChild(noteInput);
      noteRow.appendChild(noteSaveBtn);
      card.appendChild(noteRow);

      const noteHint = document.createElement("div");
      noteHint.className = "note-saved-hint";
      card.appendChild(noteHint);

      noteSaveBtn.addEventListener("click", () => saveNote(id, noteInput.value, noteSaveBtn, noteHint));

      deviceList.appendChild(card);
    });

    countTotal.textContent = String(docs.length);
    countPending.textContent = String(pending);
    countActive.textContent = String(active);
    countBlocked.textContent = String(blocked);
  }

  async function setStatus(deviceId, newStatus) {
    pendingToggles.add(deviceId);
    try {
      const updates = { status: newStatus };
      if (newStatus === "blocked") {
        // Resetting firstSeen means the "days in use" count starts over
        // from zero the next time this device is unblocked and used again.
        updates.firstSeen = serverTimestamp();
      }
      await updateDoc(doc(db, "devices", deviceId), updates);
    } catch (err) {
      alert("Não foi possível atualizar: " + err.message);
    } finally {
      pendingToggles.delete(deviceId);
    }
  }

  /** Toggles the plan picker open (reused for both approving and extending). */
  function openTimeEditor(deviceId, currentExpiresAtDate, isUnblocking) {
    const picker = document.querySelector('.plan-picker[data-device-id="' + CSS.escape(deviceId) + '"]');
    if (!picker) return;
    const willOpen = picker.style.display === "none";
    picker.dataset.unblocking = isUnblocking ? "1" : "0";
    picker.style.display = willOpen ? "flex" : "none";
    openPickerDeviceId = willOpen ? deviceId : null;
    openPickerUnblocking = isUnblocking;
  }

  /** Approves a pending device with a plan, extends an active device's time,
   *  or unblocks a blocked/expired device with a freshly chosen plan. */
  async function approveOrExtend(deviceId, plan) {
    const picker = document.querySelector('.plan-picker[data-device-id="' + CSS.escape(deviceId) + '"]');
    const isUnblocking = picker && picker.dataset.unblocking === "1";
    pendingToggles.add(deviceId);
    try {
      const expiresAt = new Date(Date.now() + plan.durationMs);
      const updates = {
        status: "active",
        plan: plan.id,
        expiresAt: expiresAt,
      };
      if (isUnblocking) updates.firstSeen = serverTimestamp();
      await updateDoc(doc(db, "devices", deviceId), updates);
      if (picker) picker.style.display = "none";
      if (openPickerDeviceId === deviceId) openPickerDeviceId = null;
    } catch (err) {
      alert("Não foi possível atualizar: " + err.message);
    } finally {
      pendingToggles.delete(deviceId);
    }
  }

  /** Lets the admin set an exact custom duration using whole days/hours/minutes
   *  fields instead of typing decimal days into a prompt(). */
  async function applyCustomTime(deviceId, days, hours, minutes) {
    const totalMs =
      (days * 24 * 60 * 60 * 1000) +
      (hours * 60 * 60 * 1000) +
      (minutes * 60 * 1000);
    if (!(totalMs > 0)) {
      alert("Informe pelo menos um valor maior que zero (dias, horas ou minutos).");
      return;
    }
    const picker = document.querySelector('.plan-picker[data-device-id="' + CSS.escape(deviceId) + '"]');
    const customForm = document.querySelector('.custom-time-form[data-device-id="' + CSS.escape(deviceId) + '"]');
    const isUnblocking = picker && picker.dataset.unblocking === "1";
    pendingToggles.add(deviceId);
    try {
      const expiresAt = new Date(Date.now() + totalMs);
      const updates = {
        status: "active",
        plan: "custom",
        expiresAt: expiresAt,
      };
      if (isUnblocking) updates.firstSeen = serverTimestamp();
      await updateDoc(doc(db, "devices", deviceId), updates);
      if (picker) picker.style.display = "none";
      if (customForm) customForm.classList.remove("open");
      if (openPickerDeviceId === deviceId) openPickerDeviceId = null;
      if (openCustomFormDeviceId === deviceId) openCustomFormDeviceId = null;
    } catch (err) {
      alert("Não foi possível atualizar: " + err.message);
    } finally {
      pendingToggles.delete(deviceId);
    }
  }

  async function saveNote(deviceId, noteText, btn, hintEl) {
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = "...";
    try {
      await updateDoc(doc(db, "devices", deviceId), { note: noteText });
      hintEl.textContent = "Salvo!";
      setTimeout(() => { hintEl.textContent = ""; }, 2000);
    } catch (err) {
      alert("Não foi possível salvar a anotação: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  async function deleteDevice(deviceId, deviceModel) {
    const label = deviceModel ? deviceModel : deviceId;
    const confirmed = confirm(
      "Excluir o dispositivo \"" + label + "\"?\n\n" +
      "Isso remove o histórico e a anotação dele. Se o mesmo aparelho abrir o " +
      "app de novo depois, ele volta a aparecer como um dispositivo novo, " +
      "aguardando aprovação."
    );
    if (!confirmed) return;
    pendingToggles.add(deviceId);
    try {
      await deleteDoc(doc(db, "devices", deviceId));
    } catch (err) {
      alert("Não foi possível excluir: " + err.message);
    } finally {
      pendingToggles.delete(deviceId);
    }
  }

  // ---- Contatos (botão de contato do app) ----

  function addExtraContactRow(label, url) {
    const row = document.createElement("div");
    row.className = "extra-contact-row";

    const labelInput = document.createElement("input");
    labelInput.type = "text";
    labelInput.className = "extra-label";
    labelInput.placeholder = "Nome (ex: Telegram)";
    labelInput.value = label || "";

    const urlInput = document.createElement("input");
    urlInput.type = "text";
    urlInput.className = "extra-url";
    urlInput.placeholder = "Link (ex: t.me/usuario)";
    urlInput.value = url || "";

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "extra-remove-btn";
    removeBtn.textContent = "✕";
    removeBtn.addEventListener("click", () => row.remove());

    row.appendChild(labelInput);
    row.appendChild(urlInput);
    row.appendChild(removeBtn);
    extraContactsList.appendChild(row);
  }

  extraAddBtn.addEventListener("click", () => addExtraContactRow("", ""));

  async function loadContacts() {
    try {
      const snapshot = await getDoc(doc(db, "config", "contacts"));
      const data = snapshot.exists() ? snapshot.data() : {};
      contactDiscordProfile.value = data.discordProfile || "";
      contactDiscordServer.value = data.discordServer || "";
      contactWhatsapp.value = data.whatsapp || "";
      extraContactsList.innerHTML = "";
      (data.extra || []).forEach((item) => addExtraContactRow(item.label, item.url));
    } catch (err) {
      contactsSavedHint.textContent = "Não foi possível carregar os contatos: " + err.message;
      contactsSavedHint.style.color = "var(--danger)";
    }
  }

  contactsSaveBtn.addEventListener("click", async () => {
    contactsSaveBtn.disabled = true;
    const originalLabel = contactsSaveBtn.textContent;
    contactsSaveBtn.textContent = "Salvando...";
    try {
      const extra = Array.from(extraContactsList.querySelectorAll(".extra-contact-row"))
        .map((row) => ({
          label: row.querySelector(".extra-label").value.trim(),
          url: row.querySelector(".extra-url").value.trim(),
        }))
        .filter((item) => item.label && item.url);

      await setDoc(doc(db, "config", "contacts"), {
        discordProfile: contactDiscordProfile.value.trim(),
        discordServer: contactDiscordServer.value.trim(),
        whatsapp: contactWhatsapp.value.trim(),
        extra: extra,
      });

      contactsSavedHint.style.color = "var(--ok)";
      contactsSavedHint.textContent = "Salvo! Já vale no app.";
      setTimeout(() => { contactsSavedHint.textContent = ""; }, 2500);
    } catch (err) {
      contactsSavedHint.style.color = "var(--danger)";
      contactsSavedHint.textContent = "Não foi possível salvar: " + err.message;
    } finally {
      contactsSaveBtn.disabled = false;
      contactsSaveBtn.textContent = originalLabel;
    }
  });
</script>

</body>
</html>
